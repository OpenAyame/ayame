name: ci
on:
  push:
    branches-ignore:
      - "master"
    tags-ignore:
      - "*"
jobs:
  ci:
    name: ci
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ./go.mod
          cache: true
          cache-dependency-path: ./go.sum
      - uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
      - run: go version
      - run: go fmt .
      - run: go build -v .
