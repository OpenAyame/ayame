name: ci
on:
  push:
    branches-ignore:
      - "master"
    tags-ignore:
      - "*"
jobs:
  ci:
    name: ci
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ./go.mod
          cache: true
          cache-dependency-path: ./go.sum
      - uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
      - run: go version
      - run: go fmt .
      - run: go build -v .
